<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2FB">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วงล้อสุ่ม">
<title>วงล้อสุ่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2FB; --card:#fff; --ink:#1F1B2E; --muted:#7A7590; --line:#E6E2F2;
    --accent:#6C5CE7; --accent-soft:#ECE9FD; --danger:#E5484D; --ok:#12A150;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Kanit',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(circle at 15% 10%,#FFE9F3 0,transparent 35%),radial-gradient(circle at 90% 85%,#E3F6FF 0,transparent 40%);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 16px 20px}
  header{display:flex;align-items:center;gap:8px}
  .icon-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:0 2px 8px rgba(40,20,90,.08)}
  .icon-btn svg{width:22px;height:22px}
  .title{flex:1;text-align:center;font-size:30px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
  .sub{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap;min-height:30px}
  .chip{font-size:14px;padding:4px 12px;border-radius:99px;background:var(--card);color:var(--muted);box-shadow:0 1px 4px rgba(40,20,90,.06);display:inline-flex;align-items:center;gap:6px}
  .chip.accent{background:var(--accent-soft);color:var(--accent)}
  .chip button{color:var(--accent);font-weight:500;font-size:14px}
  .stage{position:relative;margin:18px auto 0;width:100%;max-width:440px;aspect-ratio:1}
  .wheel-wrap{position:absolute;inset:0;border-radius:50%;background:#fff;padding:8px;box-shadow:0 10px 30px rgba(60,30,140,.15)}
  canvas#wheel{width:100%;height:100%;border-radius:50%;display:block;will-change:transform}
  .pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44px;height:52px;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
  .pointer.bump{animation:bump .12s ease}
  @keyframes bump{50%{transform:translateX(-50%) rotate(-12deg)}}
  .hub{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;z-index:2;font-size:16px;font-weight:600;color:var(--accent)}
  .hub:active{transform:translate(-50%,-50%) scale(.95)}
  .empty-wheel{position:absolute;inset:8px;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--muted);background:repeating-conic-gradient(#F1EEFA 0 15deg,#fff 15deg 30deg);padding:30px;font-size:17px}
  .spin-btn{margin:26px auto 0;display:block;width:100%;max-width:320px;padding:16px;border-radius:18px;background:var(--accent);color:#fff;font-size:20px;font-weight:600;box-shadow:0 8px 20px rgba(108,92,231,.35)}
  .spin-btn:disabled{opacity:.5}
  .history{margin-top:22px}
  .history h4{margin:0 0 8px;font-weight:500;color:var(--muted);font-size:14px}
  .history .row{display:flex;gap:6px;flex-wrap:wrap}
  .history .chip{color:var(--ink)}
  .sync{margin-top:auto;padding-top:20px;text-align:center;font-size:12px;color:var(--muted)}

  /* sheets */
  .overlay{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
  .sheet-head h2{flex:1;margin:0;font-size:24px;font-weight:600}
  .sheet-body{overflow:auto;padding:4px 16px 16px}
  .sheet-foot{padding:10px 16px 16px;display:flex;gap:10px}
  .btn{flex:1;padding:14px;border-radius:16px;font-size:17px;font-weight:500;background:var(--card);box-shadow:0 1px 4px rgba(40,20,90,.08)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.small{flex:none;padding:10px 14px;font-size:15px}

  .wheel-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent}
  .wheel-card.on{border-color:var(--accent)}
  .mini{width:56px;height:56px;border-radius:50%;flex:none;position:relative;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.15)}
  .mini::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#fff}
  .wc-name{font-size:19px;font-weight:500}
  .wc-meta{font-size:13px;color:var(--muted)}

  .field{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
  .field label.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
  .text-in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}
  .text-in:focus{border-color:var(--accent)}
  .toggle-row{display:flex;align-items:center;gap:12px}
  .toggle-row .t{flex:1}
  .toggle-row .t b{font-weight:500;display:block}
  .toggle-row .t small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
  .switch{width:54px;height:32px;border-radius:99px;background:#D9D5E6;position:relative;flex:none;transition:.2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
  .switch.on{background:var(--accent)}
  .switch.on::after{left:25px}
  .seg{display:flex;background:#F1EEFA;border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:8px;border-radius:10px;font-size:15px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .add-row{display:flex;gap:8px}
  .add-row .text-in{flex:1}
  .add-btn{width:48px;border-radius:12px;background:var(--accent);color:#fff;font-size:26px;line-height:1}
  .linkish{color:var(--accent);font-size:14px;margin-top:10px;display:inline-block}
  .items{margin-top:12px}
  .item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .dot{width:14px;height:14px;border-radius:50%;flex:none}
  .item input.name{flex:1;min-width:0;border:none;padding:8px 4px;background:transparent;outline:none;border-radius:8px}
  .item input.name:focus{background:#F6F4FC}
  .item.used input.name{color:#AAA5BC;text-decoration:line-through}
  .item select{border:1px solid var(--line);border-radius:10px;padding:6px 4px;background:#fff;font-size:14px}
  .item .x{width:34px;height:34px;border-radius:10px;color:#B5B0C6;font-size:20px;flex:none}
  .item .back{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 8px;flex:none}
  .hint{font-size:13px;color:var(--muted);margin:4px 0 0}

  /* result */
  .center-ov{align-items:center;padding:20px}
  .result{background:#fff;border-radius:28px;width:100%;max-width:380px;padding:26px 22px 20px;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  .result .lbl{color:var(--muted);font-size:15px}
  .result .win{font-size:34px;font-weight:600;margin:10px 0 6px;line-height:1.2;word-break:break-word}
  .result .note{font-size:14px;color:var(--muted);min-height:20px}
  .result .acts{display:flex;gap:10px;margin-top:18px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2A2440;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  textarea.text-in{min-height:120px;resize:vertical}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="btnList" aria-label="วงล้อทั้งหมด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="title" id="title">วงล้อสุ่ม</div>
    <button class="icon-btn" id="btnEdit" aria-label="แก้ไข">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
    </button>
  </header>
  <div class="sub" id="sub"></div>

  <div class="stage" id="stage">
    <svg class="pointer" id="pointer" viewBox="0 0 44 52"><path d="M22 50 L4 8 Q2 2 8 2 L36 2 Q42 2 40 8 Z" fill="#2A2440"/><circle cx="22" cy="14" r="5" fill="#fff"/></svg>
    <div class="wheel-wrap"><canvas id="wheel"></canvas></div>
    <div class="empty-wheel" id="emptyWheel" style="display:none">ยังไม่มีตัวเลือก<br>กด ✎ เพื่อเพิ่มได้เลย</div>
    <button class="hub" id="hub">หมุน</button>
  </div>

  <button class="spin-btn" id="spinBtn">หมุนเลย!</button>

  <div class="history" id="history"></div>
  <div class="sync" id="sync"></div>
</div>

<!-- wheel list -->
<div class="overlay" id="ovList">
  <div class="sheet">
    <div class="sheet-head"><h2>วงล้อของฉัน</h2><button class="icon-btn" data-close aria-label="ปิด">✕</button></div>
    <div class="sheet-body" id="listBody"></div>
    <div class="sheet-foot"><button class="btn primary" id="btnNew">+ สร้างวงล้อใหม่</button></div>
  </div>
</div>

<!-- editor -->
<div class="overlay" id="ovEdit">
  <div class="sheet">
    <div class="sheet-head"><h2>แก้ไขวงล้อ</h2><button class="btn primary small" data-close>เสร็จ</button></div>
    <div class="sheet-body">
      <div class="field">
        <label class="lbl">ชื่อวงล้อ</label>
        <input class="text-in" id="edName" maxlength="40" placeholder="เช่น มื้อเช้า, ใครล้างจาน">
      </div>
      <div class="field">
        <div class="toggle-row">
          <div class="t"><b>หมุนได้แล้ว เอาออกจากวงล้อ</b><small>ไม่ซ้ำจนกว่าจะออกครบทุกตัว แล้วจะดึงกลับมาเริ่มรอบใหม่ให้อัตโนมัติ</small></div>
          <button class="switch" id="edRemove" aria-label="เอาออกเมื่อหมุนได้"></button>
        </div>
      </div>
      <div class="field">
        <label class="lbl">ระยะเวลาหมุน</label>
        <div class="seg" id="edDur">
          <button data-v="3">3 วิ</button><button data-v="5">5 วิ</button><button data-v="8">8 วิ</button>
        </div>
        <div class="toggle-row" style="margin-top:14px">
          <div class="t"><b>เสียงติ๊ก ๆ ตอนหมุน</b></div>
          <button class="switch" id="edSound" aria-label="เสียง"></button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" id="edCount">ตัวเลือก</label>
        <div class="add-row">
          <input class="text-in" id="edAdd" maxlength="60" placeholder="พิมพ์ตัวเลือกแล้วกด +" enterkeyhint="done">
          <button class="add-btn" id="edAddBtn" aria-label="เพิ่ม">+</button>
        </div>
        <button class="linkish" id="edBulkToggle">วางหลายรายการพร้อมกัน</button>
        <div id="edBulk" style="display:none;margin-top:8px">
          <textarea class="text-in" id="edBulkText" placeholder="1 บรรทัด = 1 ตัวเลือก"></textarea>
          <button class="btn small primary" id="edBulkAdd" style="margin-top:8px">เพิ่มทั้งหมด</button>
        </div>
        <p class="hint">“โอกาส ×2” = มีโอกาสออกมากกว่าปกติ 2 เท่า</p>
        <div class="items" id="edItems"></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="edDup">ทำสำเนา</button>
        <button class="btn danger" id="edDel">ลบวงล้อนี้</button>
      </div>
    </div>
  </div>
</div>

<!-- result -->
<div class="overlay center-ov" id="ovResult">
  <div class="result">
    <div class="lbl">ได้แก่…</div>
    <div class="win" id="resWin"></div>
    <div class="note" id="resNote"></div>
    <div class="acts">
      <button class="btn" id="resOk">ตกลง</button>
      <button class="btn primary" id="resAgain">หมุนอีกครั้ง</button>
    </div>
  </div>
</div>

<!-- confirm -->
<div class="overlay center-ov" id="ovConfirm">
  <div class="result">
    <div class="win" style="font-size:22px" id="cfText"></div>
    <div class="acts">
      <button class="btn" id="cfNo">ยกเลิก</button>
      <button class="btn danger" id="cfYes" style="background:var(--danger);color:#fff">ยืนยัน</button>
    </div>
  </div>
</div>

<canvas class="confetti" id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
const KEY='spin-wheel-v1';
const PALETTE=['#F0525A','#FF9F2E','#F7C531','#7BCB4A','#2DBE8B','#22B7D6','#3D8BFD','#7C6CF2','#C35BE0','#F25FA4','#FF7A4D','#4CC9A6'];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- state ---------- */
function makeWheel(name,texts,opts={}){
  return {id:uid(),name,items:texts.map(t=>({id:uid(),text:t,w:1})),removeWinner:!!opts.removeWinner,used:[],duration:opts.duration||5,history:[]};
}
function defaultState(){
  const w1=makeWheel('กินอะไรดี',['ข้าวผัด','ก๋วยเตี๋ยว','ส้มตำ','ข้าวมันไก่','กะเพราไข่ดาว','สุกี้','ข้าวขาหมู','โจ๊ก']);
  const w2=makeWheel('ใช่ / ไม่ใช่',['ใช่','ไม่ใช่']);
  return {v:1,currentId:w1.id,sound:true,updatedAt:0,wheels:[w1,w2]};
}
function normalize(s){
  if(!s||!Array.isArray(s.wheels)) return defaultState();
  s.wheels.forEach(w=>{w.items=w.items||[];w.used=(w.used||[]).filter(id=>w.items.some(i=>i.id===id));w.history=w.history||[];w.duration=w.duration||5;w.items.forEach(i=>{i.w=i.w||1})});
  if(!s.wheels.length) s.wheels.push(makeWheel('วงล้อใหม่',[]));
  if(!s.wheels.some(w=>w.id===s.currentId)) s.currentId=s.wheels[0].id;
  if(s.sound===undefined) s.sound=true;
  return s;
}
let state;
try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){state=defaultState()}

const cur=()=>state.wheels.find(w=>w.id===state.currentId);
const active=w=>w.items.filter(i=>!w.used.includes(i.id)&&i.text.trim());

/* ---------- persistence (cloud + this device) ---------- */
let docRef=null,saveTimer=null,writing=false,dirty=false;
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!docRef) return;
  if(writing){dirty=true;return}
  writing=true;
  try{await docRef.set({data:JSON.parse(JSON.stringify(state)),updatedAt:state.updatedAt||Date.now()});setSync('ok')}
  catch(e){setSync('local')}
  writing=false;
  if(dirty){dirty=false;flush()}
}
function setSync(k){
  $('#sync').textContent=k==='ok'?'☁️ บันทึกอัตโนมัติแล้ว เปิดจากเครื่องไหนก็เจอ':k==='slow'?'กำลังเชื่อมต่อ…':'บันทึกไว้ในเครื่องนี้';
}
setSync('local');
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/wheels');
    const t=setTimeout(()=>setSync('slow'),10000);
    const snap=await ref.get(); clearTimeout(t);
    docRef=ref;
    if(snap.exists){
      const d=snap.data();
      if((d.updatedAt||0)>=(state.updatedAt||0) && d.data){
        if(!spinning){state=normalize(JSON.parse(JSON.stringify(d.data)));try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}renderAll()}
      } else flush();
      setSync('ok');
    } else { await flush(); }
  }catch(e){setSync('local')}
})();

/* ---------- wheel drawing ---------- */
const cv=$('#wheel'),ctx=cv.getContext('2d');
let rotation=0,spinning=false,slices=[];
function colorFor(i,n){let c=PALETTE[i%PALETTE.length];if(n>1&&i===n-1&&i%PALETTE.length===0)c=PALETTE[4];return c}
function lum(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255}
function computeSlices(w){
  const act=active(w),tot=act.reduce((s,i)=>s+i.w,0);let a=0;
  slices=act.map((it,i)=>{const d=360*it.w/tot;const s={item:it,start:a,deg:d,color:colorFor(i,act.length)};a+=d;return s});
}
function drawWheel(){
  const w=cur();computeSlices(w);
  const size=cv.clientWidth||300,dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=size*dpr;cv.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=size/2;ctx.clearRect(0,0,size,size);
  $('#emptyWheel').style.display=slices.length?'none':'grid';
  if(!slices.length) return;
  const rad=d=>(d-90)*Math.PI/180;
  slices.forEach(s=>{
    ctx.beginPath();ctx.moveTo(r,r);
    if(slices.length===1) ctx.arc(r,r,r,0,Math.PI*2); else ctx.arc(r,r,r,rad(s.start),rad(s.start+s.deg));
    ctx.closePath();ctx.fillStyle=s.color;ctx.fill();
    if(slices.length>1){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;ctx.stroke()}
  });
  // labels
  slices.forEach(s=>{
    const mid=rad(s.start+s.deg/2);const arc=(s.deg*Math.PI/180)*r*0.62;
    let fs=Math.max(11,Math.min(24,arc*0.6,r*0.11));if(slices.length===1)fs=Math.min(26,r*0.12);
    ctx.save();ctx.translate(r,r);ctx.rotate(mid);
    ctx.font=`500 ${fs}px Kanit, sans-serif`;ctx.textAlign='right';ctx.textBaseline='middle';
    const maxW=r*0.68;let t=s.item.text.trim();
    if(ctx.measureText(t).width>maxW){while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);t+='…'}
    const dark=lum(s.color)>0.72;
    ctx.fillStyle=dark?'#2A2440':'#fff';
    if(!dark){ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=3}
    ctx.fillText(t,r-14,1);ctx.restore();
  });
  // rim dots
  ctx.save();ctx.translate(r,r);
  for(let k=0;k<24;k++){const a=k*Math.PI/12;ctx.beginPath();ctx.arc(Math.cos(a)*(r-5),Math.sin(a)*(r-5),2.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill()}
  ctx.restore();
  setRot(rotation);
}
function setRot(d){cv.style.transform=`rotate(${d}deg)`}

/* ---------- sound ---------- */
let ac=null;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function tick(){
  if(!state.sound||!ac) return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=1400;
  g.gain.setValueAtTime(0.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.04);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.05)}catch(e){}
}
function chime(){
  if(!state.sound||!ac) return;
  try{[660,880,1320].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*0.09;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.15,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.55)})}catch(e){}
}

/* ---------- spin ---------- */
function sliceAt(rot){const p=((-rot)%360+360)%360;return slices.findIndex(s=>p>=s.start&&p<s.start+s.deg)}
function spin(){
  if(spinning) return;
  const w=cur();computeSlices(w);
  if(!slices.length){toast('ยังไม่มีตัวเลือก กด ✎ เพื่อเพิ่มก่อนนะคะ');return}
  initAudio();
  const tot=slices.reduce((s,x)=>s+x.deg,0);let r=Math.random()*tot,win=slices[slices.length-1];
  for(const s of slices){if(r<s.deg){win=s;break}r-=s.deg}
  const m=Math.min(win.deg*0.18,6);const t=win.start+m+Math.random()*(win.deg-2*m);
  const from=rotation,base=from-(((from%360)+360)%360);
  const dur=(w.duration||5)*1000;
  let to=base+360*Math.round(3+w.duration*1.2)+((360-t)%360);
  if(to-from<720) to+=360;
  spinning=true;setBusy(true);
  const t0=performance.now();let last=sliceAt(from),lastTick=0;
  const ease=x=>1-Math.pow(1-x,4);
  function frame(now){
    const k=Math.min(1,(now-t0)/dur);rotation=from+(to-from)*ease(k);setRot(rotation);
    const idx=sliceAt(rotation);
    if(idx!==last&&slices.length>1){last=idx;if(now-lastTick>35){tick();lastTick=now;const p=$('#pointer');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}}
    if(k<1) requestAnimationFrame(frame);
    else{rotation=((to%360)+360)%360;setRot(rotation);spinning=false;setBusy(false);showResult(win.item)}
  }
  requestAnimationFrame(frame);
}
function setBusy(b){$('#spinBtn').disabled=b;$('#hub').disabled=b}

let pendingWin=null;
function showResult(item){
  const w=cur();pendingWin=item;
  w.history.unshift(item.text);w.history=w.history.slice(0,8);save();
  $('#resWin').textContent=item.text;
  if(w.removeWinner){
    const left=active(w).length-1;
    $('#resNote').textContent=left>0?`ตัวเลือกนี้จะถูกนำออก (เหลืออีก ${left})`:'ครบทุกตัวเลือกแล้ว! จะเริ่มรอบใหม่ 🎉';
  } else $('#resNote').textContent='';
  open('#ovResult');chime();confetti();
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  renderHistory();
}
function settleResult(){
  if(!pendingWin) return;
  const w=cur(),item=pendingWin;pendingWin=null;
  if(w.removeWinner&&w.items.some(i=>i.id===item.id)){
    if(!w.used.includes(item.id)) w.used.push(item.id);
    if(active(w).length===0){w.used=[];toast('ครบทุกตัวแล้ว ดึงตัวเลือกกลับมาเริ่มรอบใหม่ 🎉')}
    save();
  }
  close('#ovResult');renderMain();
}
$('#resOk').onclick=settleResult;
$('#resAgain').onclick=()=>{settleResult();setTimeout(spin,250)};
$('#ovResult').addEventListener('click',e=>{if(e.target.id==='ovResult')settleResult()});

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*0.38,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*6+4,c:PALETTE[Math.floor(Math.random()*PALETTE.length)],r:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=0.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- main screen ---------- */
function renderMain(){
  const w=cur();
  $('#title').textContent=w.name||'วงล้อ';
  const sub=$('#sub');sub.innerHTML='';
  const act=active(w).length,all=w.items.filter(i=>i.text.trim()).length;
  if(w.removeWinner){
    const c=document.createElement('span');c.className='chip accent';c.textContent=`เหลือ ${act}/${all}`;sub.appendChild(c);
    if(w.used.length){const b=document.createElement('span');b.className='chip';const btn=document.createElement('button');btn.textContent='↺ ดึงกลับมาทั้งหมด';btn.onclick=()=>{w.used=[];save();renderMain();toast('ดึงตัวเลือกกลับมาครบแล้ว')};b.appendChild(btn);sub.appendChild(b)}
  } else if(all){const c=document.createElement('span');c.className='chip';c.textContent=`${all} ตัวเลือก`;sub.appendChild(c)}
  drawWheel();renderHistory();
}
function renderHistory(){
  const w=cur(),h=$('#history');h.innerHTML='';
  if(!w.history.length) return;
  const t=document.createElement('h4');t.textContent='ผลล่าสุด';h.appendChild(t);
  const row=document.createElement('div');row.className='row';
  w.history.forEach(x=>{const c=document.createElement('span');c.className='chip';c.textContent=x;row.appendChild(c)});
  h.appendChild(row);
}
$('#spinBtn').onclick=spin;$('#hub').onclick=spin;cv.onclick=spin;

/* ---------- overlays ---------- */
function open(s){$(s).classList.add('show')}
function close(s){$(s).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const o=b.closest('.overlay');o.classList.remove('show');if(o.id==='ovEdit')closeEditor()});
['#ovList','#ovEdit'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id)){close(id);if(id==='#ovEdit')closeEditor()}}));

let cfCb=null;
function confirmBox(text,cb){$('#cfText').textContent=text;cfCb=cb;open('#ovConfirm')}
$('#cfNo').onclick=()=>close('#ovConfirm');
$('#cfYes').onclick=()=>{close('#ovConfirm');cfCb&&cfCb()};

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- list ---------- */
function conic(w){
  const act=w.items.filter(i=>i.text.trim());if(!act.length)return '#E6E2F2';
  const tot=act.reduce((s,i)=>s+i.w,0);let a=0;
  return 'conic-gradient('+act.map((it,i)=>{const s=a;a+=360*it.w/tot;return `${colorFor(i,act.length)} ${s}deg ${a}deg`}).join(',')+')';
}
function renderList(){
  const b=$('#listBody');b.innerHTML='';
  state.wheels.forEach(w=>{
    const c=document.createElement('button');c.className='wheel-card'+(w.id===state.currentId?' on':'');
    const m=document.createElement('div');m.className='mini';m.style.background=conic(w);
    const tx=document.createElement('div');
    const n=document.createElement('div');n.className='wc-name';n.textContent=w.name||'วงล้อ';
    const meta=document.createElement('div');meta.className='wc-meta';
    const cnt=w.items.filter(i=>i.text.trim()).length;
    meta.textContent=`${cnt} ตัวเลือก`+(w.removeWinner?` · ไม่ซ้ำ (เหลือ ${active(w).length})`:'');
    tx.append(n,meta);c.append(m,tx);
    c.onclick=()=>{if(spinning)return;state.currentId=w.id;rotation=0;save();close('#ovList');renderMain()};
    b.appendChild(c);
  });
}
$('#btnList').onclick=()=>{if(spinning)return;renderList();open('#ovList')};
$('#btnNew').onclick=()=>{const w=makeWheel('วงล้อใหม่',[]);state.wheels.push(w);state.currentId=w.id;rotation=0;save();close('#ovList');renderMain();openEditor(true)};

/* ---------- editor ---------- */
function openEditor(focusName){
  if(spinning) return;
  const w=cur();
  $('#edName').value=w.name;
  $('#edRemove').classList.toggle('on',w.removeWinner);
  $('#edSound').classList.toggle('on',state.sound);
  document.querySelectorAll('#edDur button').forEach(b=>b.classList.toggle('on',+b.dataset.v===w.duration));
  $('#edBulk').style.display='none';
  renderItems();open('#ovEdit');
  if(focusName===true) setTimeout(()=>{$('#edName').select();$('#edName').focus()},250);
}
function closeEditor(){
  const w=cur();w.items=w.items.filter(i=>i.text.trim());w.used=w.used.filter(id=>w.items.some(i=>i.id===id));
  if(active(w).length===0&&w.used.length) w.used=[];
  save();renderMain();
}
function renderItems(){
  const w=cur(),box=$('#edItems');box.innerHTML='';
  const named=w.items.filter(i=>i.text.trim());
  $('#edCount').textContent=`ตัวเลือก (${named.length})`;
  w.items.forEach((it,idx)=>{
    const used=w.used.includes(it.id);
    const row=document.createElement('div');row.className='item'+(used?' used':'');
    const dot=document.createElement('span');dot.className='dot';
    const ai=active(w).findIndex(a=>a.id===it.id);dot.style.background=used?'#D9D5E6':colorFor(ai<0?idx:ai,active(w).length);
    const inp=document.createElement('input');inp.className='name';inp.value=it.text;inp.maxLength=60;
    inp.oninput=()=>{it.text=inp.value;save()};
    row.append(dot,inp);
    if(used){const b=document.createElement('button');b.className='back';b.textContent='ออกแล้ว · ดึงกลับ';b.onclick=()=>{w.used=w.used.filter(x=>x!==it.id);save();renderItems()};row.appendChild(b)}
    else{
      const sel=document.createElement('select');[1,2,3,4,5].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent='โอกาส ×'+v;if(v===it.w)o.selected=true;sel.appendChild(o)});
      sel.onchange=()=>{it.w=+sel.value;save()};row.appendChild(sel);
    }
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','ลบ');
    x.onclick=()=>{w.items=w.items.filter(i=>i.id!==it.id);w.used=w.used.filter(i=>i!==it.id);save();renderItems()};
    row.appendChild(x);box.appendChild(row);
  });
  if(!w.items.length){const p=document.createElement('p');p.className='hint';p.textContent='ยังไม่มีตัวเลือก ลองพิมพ์ด้านบนได้เลย';box.appendChild(p)}
}
function addItems(texts){
  const w=cur();const clean=texts.map(t=>t.trim()).filter(Boolean);
  if(!clean.length) return 0;
  clean.forEach(t=>w.items.push({id:uid(),text:t,w:1}));save();renderItems();return clean.length;
}
$('#btnEdit').onclick=()=>openEditor();
$('#edName').oninput=e=>{cur().name=e.target.value;save();$('#title').textContent=e.target.value||'วงล้อ'};
$('#edRemove').onclick=()=>{const w=cur();w.removeWinner=!w.removeWinner;if(!w.removeWinner)w.used=[];$('#edRemove').classList.toggle('on',w.removeWinner);save();renderItems()};
$('#edSound').onclick=()=>{state.sound=!state.sound;$('#edSound').classList.toggle('on',state.sound);save()};
document.querySelectorAll('#edDur button').forEach(b=>b.onclick=()=>{cur().duration=+b.dataset.v;document.querySelectorAll('#edDur button').forEach(x=>x.classList.toggle('on',x===b));save()});
function addOne(){const i=$('#edAdd');if(addItems([i.value])){i.value='';i.focus()}}
$('#edAddBtn').onclick=addOne;
$('#edAdd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addOne()}});
$('#edBulkToggle').onclick=()=>{const b=$('#edBulk');b.style.display=b.style.display==='none'?'block':'none'};
$('#edBulkAdd').onclick=()=>{const n=addItems($('#edBulkText').value.split(/\n|,/));if(n){$('#edBulkText').value='';$('#edBulk').style.display='none';toast(`เพิ่ม ${n} ตัวเลือกแล้ว`)}};
$('#edDup').onclick=()=>{const w=cur();const c=JSON.parse(JSON.stringify(w));c.id=uid();c.name=(w.name||'วงล้อ')+' (สำเนา)';c.items.forEach(i=>i.id=uid());c.used=[];c.history=[];state.wheels.push(c);state.currentId=c.id;rotation=0;save();openEditor();toast('ทำสำเนาแล้ว')};
$('#edDel').onclick=()=>confirmBox(`ลบวงล้อ “${cur().name||'วงล้อ'}” ใช่ไหม?`,()=>{
  state.wheels=state.wheels.filter(w=>w.id!==state.currentId);
  if(!state.wheels.length) state.wheels.push(makeWheel('วงล้อใหม่',[]));
  state.currentId=state.wheels[0].id;rotation=0;save();close('#ovEdit');renderMain();toast('ลบแล้ว');
});

/* ---------- boot ---------- */
function renderAll(){renderMain()}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!spinning)drawWheel()},150)});
renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(!spinning)drawWheel()});
})();
</script>
</body>
